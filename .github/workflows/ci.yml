# Runs all tests and the production build on every push to main (and on pull requests).
# Results: the "Actions" tab on GitHub, and the badge at the top of README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version   # same version as Render (3.14)
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Tests
        run: python manage.py test movies

      - name: Production settings load (DEBUG off)
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: example.com
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --no-input

  frontend:
    name: Frontend tests + build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build
