<div class="movie-card" (click)="openMovie()">
  <div class="poster-wrap">
    @if (movie.poster_url) {
      <img [src]="movie.poster_url" [alt]="movie.title" />
    } @else {
      <div class="no-poster">No poster</div>
    }
  </div>

  <div class="movie-info">
    <h3>{{ movie.title }} <span class="year">({{ movie.year }})</span></h3>

    <div class="meta-row">
      @if (movie.genres.length) {
        <span class="genre-badge">{{ movie.genres[0].name }}</span>
      }

      <div class="stats">
        <span class="rating">{{ movie.rating | rating }}</span>
      </div>
    </div>
  </div>
</div>
