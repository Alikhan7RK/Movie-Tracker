<a class="movie-card" [routerLink]="['/movies', movie.id]">
  <div class="poster">
    <img class="poster-img" [src]="movie.poster_url || '/no-poster.svg'" [alt]="movie.title" loading="lazy" />
    <span class="rating-badge">{{ movie.rating | rating }}</span>
  </div>

  <div class="info">
    <h3 class="title">{{ movie.title }}</h3>
    <p class="meta">{{ movie.year }}@if (movie.content_type !== 'movie') { · {{ typeLabel }} }</p>
  </div>
</a>
