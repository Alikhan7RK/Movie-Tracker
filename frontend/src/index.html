<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CineTrack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before Angular starts, so the page doesn't flash the wrong colors.
    // ThemeService (src/app/services/theme.service.ts) uses the same 'theme' key.
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      // Dark is the default; light only after the user switches to it
      if (theme !== 'light') {
        theme = 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
